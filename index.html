<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2300d4aa'/%3E%3C/svg%3E"
    />
    <!-- タイトルは workshop.config.json の title で差し替わる（vite.config.ts 参照）。 -->
    <title>%WORKSHOP_TITLE%</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Geolonia Maps 本体（CDN）。API キーは .env.local の VITE_GEOLONIA_API_KEY から Vite が埋め込む。 -->
    <script src="https://cdn.geolonia.com/v1/embed?geolonia-api-key=%VITE_GEOLONIA_API_KEY%"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
