<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2300d4aa'/%3E%3C/svg%3E"
    />
    <title>オープンデータマップ</title>
  </head>
  <body>
    <!--
      地図は静的な HTML として置く（Embed API は script 実行時点の DOM を見て
      class="geolonia" の div を地図に変換するため、React が後から差し込む
      要素だと間に合わない）。開催地に合わせて data-lat / data-lng / data-zoom
      を変える。
    -->
    <div
      class="geolonia"
      style="position: fixed; inset: 0"
      data-style="geolonia/gsi"
      data-lat="35.681236"
      data-lng="139.767125"
      data-zoom="14"
      data-navigation-control="top-right"
      data-marker="off"
    ></div>
    <div id="root"></div>
    <!-- Geolonia Maps 本体（CDN）。API キーは .env.local の VITE_GEOLONIA_API_KEY から Vite が埋め込む。 -->
    <script src="https://cdn.geolonia.com/v1/embed?geolonia-api-key=%VITE_GEOLONIA_API_KEY%"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
