name: Deploy to GitHub Pages

# 初回の push で Pages を自動的に有効化する (configure-pages の enablement: true)。
# 権限などで自動有効化に失敗した場合は、Settings → Pages → Build and deployment →
# Source を「GitHub Actions」に変更してから、このワークフローを再実行する。
#
# 接続先は Settings → Secrets and variables → Actions → Variables に
# VITE_GEONICDB_URL と VITE_GEONICDB_TENANT を登録する。
# ブラウザ側は匿名の読み取り専用なので、API キーの登録は不要。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # テンプレート本体では動かさない（Pages を有効化していないため必ず失敗する）。
    # 「Use this template」で作られた各自のリポジトリでだけ走る。
    if: github.repository != 'geolonia/geonicdb-workshop-nagoya'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_GEONICDB_URL: ${{ vars.VITE_GEONICDB_URL || 'https://geonicdb.geolonia.com' }}
          VITE_GEONICDB_TENANT: ${{ vars.VITE_GEONICDB_TENANT }}
          VITE_GEOLONIA_API_KEY: ${{ vars.VITE_GEOLONIA_API_KEY || 'YOUR-API-KEY' }}
      - uses: actions/configure-pages@v5
        with:
          # 参加者が Settings を触らなくても Pages を有効化する。
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
